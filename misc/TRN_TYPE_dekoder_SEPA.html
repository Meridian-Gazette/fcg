<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chráněná stránka</title>
<style>
  :root{ --bg:#F4F6FA; --surface:#FFFFFF; --ink:#1C2738; --muted:#5A6678;
    --line:#D9E0EB; --accent:#2451C8; --err:#B03566; }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0D1420; --surface:#151F2E; --ink:#E5EBF4; --muted:#98A5BA;
    --line:#2B3850; --accent:#8AACFF; --err:#E886AD; } }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,Arial,sans-serif; font-size:16px}
  form{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:32px 28px; width:min(340px, calc(100vw - 32px));
    box-shadow:0 8px 24px rgba(0,0,0,.08)}
  h1{margin:0 0 6px; font-size:1.05rem; font-weight:600}
  p.hint{margin:0 0 18px; color:var(--muted); font-size:.85rem}
  input{width:100%; padding:10px 12px; font-size:1rem; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%; margin-top:12px; padding:10px 12px; font-size:1rem; font-weight:600;
    color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer}
  button:disabled{opacity:.6; cursor:wait}
  .err{margin:10px 0 0; color:var(--err); font-size:.85rem; min-height:1.2em}
</style>
</head>
<body>
<form id="f">
  <h1>Chráněná stránka</h1>
  <p class="hint">Obsah je zašifrovaný. Zadej heslo.</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button id="btn" type="submit">Odemknout</button>
  <p class="err" id="err"></p>
</form>

const ITER = 600000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SKEY = "pp:" + location.pathname;

async function decrypt(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
    "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(ENC.salt), iterations:ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.data));
  return new TextDecoder().decode(pt);
}

function show(html){
  document.open();
  document.write(html);
  document.close();
}

const form = document.getElementById("f");
const input = document.getElementById("pw");
const btn = document.getElementById("btn");
const err = document.getElementById("err");

form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Ověřuji…";
  try {
    const html = await decrypt(input.value);
    try { sessionStorage.setItem(SKEY, input.value); } catch {}
    show(html);
  } catch {
    btn.disabled = false; btn.textContent = "Odemknout";
    err.textContent = "Špatné heslo.";
    input.select();
  }
});

// Auto-odemknutí v rámci session (přežije reload, ne zavření tabu).
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(SKEY); } catch {}
  if (!saved) return;
  try { show(await decrypt(saved)); }
  catch { try { sessionStorage.removeItem(SKEY); } catch {} }
})();
</script>
